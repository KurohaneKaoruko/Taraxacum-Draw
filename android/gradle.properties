org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Cross-drive issue: pub cache on C:, project on D: breaks Kotlin incremental cache
# (IllegalArgumentException: different roots). Disable incremental Kotlin compilation.
kotlin.incremental=false
